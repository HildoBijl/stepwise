name: Continuous Integration
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Run all tests
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "testing"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "12345"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Build packages
        run: npm run build:packages
      - name: Verify package ESM entry points
        run: npm run verify:package-entry-points
      - name: Verify package artifacts
        run: npm run verify:package-artifacts
      - name: Type-check API
        run: npm run typecheck:api
      - name: Build API output
        run: npm run build --workspace=@step-wise/api
      - name: Run package tests
        run: npm run test:packages
      - name: Setup test environment
        run: |
          sudo mkdir /config
          sudo touch /config/api.env
          docker network create api
          docker run -d --network=api --name=$POSTGRES_HOST -p $POSTGRES_PORT:5432 \
            -e POSTGRES_DB=$POSTGRES_DB \
            -e POSTGRES_USER=$POSTGRES_USER \
            -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            postgres:15.2
      - name: Build frontend
        run: |
          docker build \
            --build-arg VITE_API_ADDRESS="https://api.step-wise.com" \
            --build-arg VITE_API_WEBSOCKET_ENDPOINT="graphql-ws" \
            --build-arg VITE_GOOGLE_CLIENT_ID="212013243072-slab3pojp2u1pirqfr5g7p78280l2b8q.apps.googleusercontent.com" \
            --build-arg VITE_GOOGLE_REDIRECT_ADDRESS="https://step-wise.com" \
            -t frontend-build:latest \
            -f frontend/Dockerfile .
      - name: Build API image
        run: docker build -t stepwisecom/api:latest -f api/Dockerfile .
      - name: Build gateway
        run: docker build -t stepwisecom/gateway:latest -f ops/gateway/Dockerfile .
      - name: Run api tests
        run: |
          touch lastSessionData && chmod 0777 lastSessionData
          docker run --rm -t --network=api \
            -e POSTGRES_DB=$POSTGRES_DB \
            -e POSTGRES_ADMIN_USER=$POSTGRES_USER \
            -e POSTGRES_ADMIN_PASSWORD=$POSTGRES_PASSWORD \
            -e POSTGRES_APP_USER=$POSTGRES_USER \
            -e POSTGRES_APP_PASSWORD=$POSTGRES_PASSWORD \
            -e POSTGRES_HOST=$POSTGRES_HOST \
            -e POSTGRES_PORT=$POSTGRES_PORT \
            -v $(pwd)/lastSessionData:/app/api/lastSessionData \
            stepwisecom/api npm test
      - name: Run frontend tests
        run: docker run --rm -e CI=true frontend-build:latest npm test
      - name: Publish images (only on main branch)
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_REGISTRY_KEY: ${{ secrets.DOCKER_REGISTRY_KEY }}
        run: |
          echo "$DOCKER_REGISTRY_KEY" | docker login --username stepwisecom --password-stdin
          docker push stepwisecom/api:latest
          docker push stepwisecom/gateway:latest
